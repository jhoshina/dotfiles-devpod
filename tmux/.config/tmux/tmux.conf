# set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.local/share/tmux/plugins/'

# --- General / Display -------------------------------------------
# Support 256color and RGB (true color)
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"

# Start windows numbering at 1 and reorder on close
set -g base-index 1
set -g renumber-windows on

# --- Input / Behavior --------------------------------------------
# Address vim mode switching delay (http://superuser.com/a/252717/65504)
set -g escape-time 0

# Enable mouse support
set -g mouse on

# --- Window / Pane Settings --------------------------------------
# Use vi keybindings in copy mode
set -wg mode-keys vi

# Start panes numbering at 1
set -wg pane-base-index 1

# -----------------------------------------------------------------
# mkdir -p ~/.local/share/tmux/plugins
# git clone -b v2.1.3 https://github.com/catppuccin/tmux.git ~/.local/share/tmux/plugins/catppuccin

# Configure the catppuccin plugin
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"

run ~/.local/share/tmux/plugins/catppuccin/catppuccin.tmux

# git clone https://github.com/tmux-plugins/tpm ~/.local/share/tmux/plugins/tpm
# set -g @plugin 'tmux-plugins/tpm'
# set -g @plugin 'tmux-plugins/tmux-sensible'
# set -g @plugin 'catppuccin/tmux#v2.1.3'
# set -g @plugin 'tmux-plugins/tmux-cpu'
# set -g @plugin 'tmux-plugins/tmux-battery'

# Make the status line pretty and add some modules
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
# set -agF status-right "#{E:@catppuccin_status_cpu}"
set -ag status-right "#{E:@catppuccin_status_session}"
# set -ag status-right "#{E:@catppuccin_status_uptime}"
# set -agF status-right "#{E:@catppuccin_status_battery}"
set -g status-position top

set -g status-bg default
set -g status-style bg=default

# --- keybindings -------------------------------------------------

# Set the prefix to C-z
unbind C-b
set -g prefix C-z
bind C-z send-prefix

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind C-o popup -E -d "#{pane_current_path}" -w 90% -h 90% "opencode"

